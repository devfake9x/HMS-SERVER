// HMS-IDF License System — wire schema (v2.1.1)
// Spec: document/LICENSE_SYSTEM_DESIGN.md §3
//
// Custom-anything: tier_label is free string, features are repeated string,
// quotas are repeated LicenseQuota (NOT map<>; repo has no nanopb map<> precedent — see BLK-1).
syntax = "proto3";
package hms.license;
import "nanopb.proto";

// =================================================================
// Envelope (vendor-signed wrapper)
// =================================================================
message LicenseEnvelope {
    uint32 schema_version = 1;                          // = 1 (Phase 1)
    bytes  payload        = 2 [(nanopb).max_size = 1536];
    bytes  signature      = 3 [(nanopb).max_size = 72]; // ECDSA P-256 DER
    string signer_kid     = 4 [(nanopb).max_size = 32]; // vendor key id
    uint32 sig_algorithm  = 5;                          // 1 = ECDSA_P256_SHA256
}

// =================================================================
// Quota entry (BLK-1 fix — explicit message instead of map<>)
// =================================================================
message LicenseQuota {
    string key   = 1 [(nanopb).max_size = 32];
    uint32 value = 2;
}

// =================================================================
// Payload (signed)
// =================================================================
message LicensePayload {
    // -- Identity --
    string license_id     = 1 [(nanopb).max_size = 40];
    string customer_id    = 2 [(nanopb).max_size = 64];
    string product_sku    = 3 [(nanopb).max_size = 32];

    // -- Soft device binding (administrative, NOT hardware-grade) --
    bytes  device_mac          = 10 [(nanopb).max_size = 6, (nanopb).fixed_length = true];
    string device_id           = 11 [(nanopb).max_size = 32];
    string product_model       = 12 [(nanopb).max_size = 32];
    string board_serial        = 13 [(nanopb).max_size = 32];

    // -- Lifecycle --
    uint64 issued_at           = 20;
    uint64 not_before          = 21;
    uint64 not_after           = 22;   // 0 = perpetual
    uint32 grace_period_days   = 23;
    bool   is_trial            = 24;
    bool   is_subscription     = 25;

    // -- Anti-replay (API-level only) --
    uint32 issue_counter       = 30;
    bytes  request_nonce       = 31 [(nanopb).max_size = 16, (nanopb).fixed_length = true];
    string firmware_min_ver    = 32 [(nanopb).max_size = 24];

    // -- CUSTOM-ANYTHING --
    string tier_label          = 40 [(nanopb).max_size = 32];
    repeated string features   = 41 [(nanopb).max_count = 32, (nanopb).max_size = 32];
    repeated LicenseQuota quotas = 42 [(nanopb).max_count = 32];
    string custom_metadata     = 43 [(nanopb).max_size = 512];

    // -- Optional --
    string customer_note       = 60 [(nanopb).max_size = 128];
    string region_code         = 61 [(nanopb).max_size = 4];
}

// =================================================================
// Request file (UNSIGNED — pure metadata, generated by device)
// =================================================================
message LicenseRequest {
    uint32 schema_version       = 1;
    bytes  device_mac           = 2  [(nanopb).max_size = 6, (nanopb).fixed_length = true];
    string device_id            = 3  [(nanopb).max_size = 32];
    string product_model        = 4  [(nanopb).max_size = 32];
    string board_serial         = 5  [(nanopb).max_size = 32];
    string firmware_version     = 6  [(nanopb).max_size = 24];
    string current_license_id   = 7  [(nanopb).max_size = 40];
    uint32 current_counter      = 8;
    bytes  nonce                = 9  [(nanopb).max_size = 16, (nanopb).fixed_length = true];
    uint64 request_timestamp    = 10;
    string customer_request_note = 11 [(nanopb).max_size = 128];
}
